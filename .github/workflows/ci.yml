# SPDX-License-Identifier: MIT
#
# Continuous integration: build and run the test suite on every push to
# main and on every pull request. The tests check the official SMHasher3
# verification value (0xD5E60849), so every job proves that the code is
# bit-for-bit the RH512 function tested by SMHasher3 on that platform.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Clang (ARM64)
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (GCC / Clang)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Configure (MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Linux sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  big-endian:
    name: Big-endian s390x (QEMU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install s390x cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu qemu-user

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=s390x
          -DCMAKE_C_COMPILER=s390x-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-s390x;-L;/usr/s390x-linux-gnu"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
